# Waypoints de la misión autónoma del PuzzleBot.
#
# IMPORTANTE: las posiciones de abajo son PLACEHOLDERS (0.0) para poder
# probar la máquina de estados del mission_manager en simulación antes
# de tener el mapa real medido. Reemplázalas por las coordenadas reales
# (en el frame 'map') antes de correr en el robot real.
#
# Cada punto define:
#   position:    {x, y}       — en metros, frame 'map'
#   orientation: {w}          — quaternion solo-yaw (w = cos(yaw/2)); si necesitas
#                                una orientación distinta de 0 rad agrega también
#                                el campo 'z' (z = sin(yaw/2))
#
# 'general' es el primer waypoint de cada zona — ahí el robot se detiene
# y arranca el barrido rotacional para contar pallets / buscar QR.
# 'p1'..'pN' son los puntos de recogida específicos de cada pallet,
# numerados de izquierda a derecha tal como los ve el robot parado en 'general'.

