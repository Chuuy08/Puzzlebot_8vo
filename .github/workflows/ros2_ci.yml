name: ROS 2 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-check:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup ROS 2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Install dependencies with rosdep
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y

      - name: Python syntax check
        run: |
          echo "--- Verificando sintaxis Python ---"
          ERRORS=0
          while IFS= read -r -d '' f; do
            if python3 -m py_compile "$f"; then
              echo "  OK   $f"
            else
              echo "  FAIL $f"
              ERRORS=$((ERRORS+1))
            fi
          done < <(find src -name "*.py" ! -path "*/Acts_extras/*" -print0)
          if [ $ERRORS -gt 0 ]; then
            echo "FALLO: $ERRORS archivo(s) con errores de sintaxis"
            exit 1
          fi
          echo "Sintaxis OK"

      - name: Build workspace
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build \
            --packages-select \
              puzzlebot_challenge \
              puzzlebot_control \
              puzzlebot_description \
              puzzlebot_gazebo \
              puzzlebot_localisation \
            --event-handlers console_direct+

      - name: Validate launch files
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          echo "--- Validando launch files ---"

          cat > /tmp/check_launch.py << 'PYEOF'
          import importlib.util, sys
          f = sys.argv[1]
          spec = importlib.util.spec_from_file_location("launch_module", f)
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          PYEOF

          ERRORS=0
          while IFS= read -r -d '' f; do
            if python3 /tmp/check_launch.py "$f" 2>&1; then
              echo "  OK   $f"
            else
              echo "  FAIL $f"
              ERRORS=$((ERRORS+1))
            fi
          done < <(find src -name "*launch*.py" ! -path "*/Acts_extras/*" -print0)
          if [ $ERRORS -gt 0 ]; then
            echo "FALLO: $ERRORS launch file(s) con errores"
            exit 1
          fi
          echo "Launch files OK"

      - name: List available executables  
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          echo "--- Executables registrados ---"
          ros2 pkg executables puzzlebot_challenge    || true
          ros2 pkg executables puzzlebot_control      || true
          ros2 pkg executables puzzlebot_localisation || true
